title: "Design Patterns for Python, ML & AI — The Complete Guide"
description: "From Principles to Production: GoF classics, Pythonic idioms, PyTorch patterns, MLOps architecture, and agentic AI design patterns."
baseurl: "/design-patterns"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

